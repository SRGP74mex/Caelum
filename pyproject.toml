[project]
name = "caelum"
version = "1.5.0"
description = "Caelum - Aplicación de clima y astronomía estilo Apple para Linux con PySide6"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.2",
    "requests==2.34.2",
    "hijri-converter==2.3.2.post1",
    "python-dateutil==2.9.0.post0",
]

[project.scripts]
caelum = "main:main"
weather-linux = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["src", "src.modelos", "src.servicios", "src.componentes", "src.vistas", "src.utils"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (línea larga) se ignora deliberadamente: la mayoría son diccionarios/cadenas
# de datos en español donde forzar el wrap no aporta legibilidad real.
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
