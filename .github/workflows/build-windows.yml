name: Build Windows MSI Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-msi:
    name: Compilar Caelum MSI para Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias del proyecto y compilador cx_Freeze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cx_Freeze

      - name: Generar paquete instalador MSI (bdist_msi)
        run: |
          python setup_msi.py bdist_msi

      - name: Subir instalador MSI como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Caelum-v1.5.0-Windows-x64-MSI
          path: dist/*.msi
          if-no-files-found: error
