name: Build Windows MSI Installer

on:
  workflow_dispatch:

jobs:
  build-windows-msi:
    name: Compilar Caelum MSI para Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias del proyecto y herramientas de empaquetado
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cx_Freeze pyinstaller

      - name: Generar paquete instalador MSI (bdist_msi)
        run: |
          python setup_msi.py bdist_msi

      - name: Generar ejecutable portable con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Caelum" --icon "assets/icons/app_icon.ico" --add-data "assets;assets" --add-data "config.py;." main.py

      - name: Subir instalador MSI como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Caelum-${{ github.ref_name }}-Windows-x64-MSI
          path: dist/*.msi
          if-no-files-found: warn

      - name: Subir version Portable
        uses: actions/upload-artifact@v4
        with:
          name: Caelum-${{ github.ref_name }}-Windows-x64-Portable
          path: dist/Caelum/
          if-no-files-found: warn
