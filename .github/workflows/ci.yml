name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias del proyecto
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type-check (mypy, no bloqueante)
        run: python -m mypy src/ main.py config.py || true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias del sistema para Qt (modo offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libdbus-1-3

      - name: Instalar dependencias del proyecto
        run: pip install -r requirements-dev.txt

      - name: Tests (headless, sin display)
        id: tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        continue-on-error: true
        run: python -m unittest discover -s tests -p "test_*.py" -v > test_output.log 2>&1

      # DIAGNÓSTICO TEMPORAL: si los tests fallan, publica el traceback completo
      # como anotación del check-run (visible públicamente vía la API de GitHub
      # sin necesitar permisos de admin). Quitar este paso una vez resuelto el
      # fallo de CI que se está investigando.
      - name: Publicar detalle del fallo como anotación
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          tail -c 60000 test_output.log > test_output_trunc.log
          MSG=$(python -c "import sys; c = open('test_output_trunc.log', encoding='utf-8', errors='replace').read(); sys.stdout.write(c.replace(chr(37), '%25').replace(chr(13), '%0D').replace(chr(10), '%0A'))")
          echo "::error title=Fallo de tests (${{ matrix.os }})::$MSG"

      - name: Fallar el job si los tests fallaron
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: exit 1
