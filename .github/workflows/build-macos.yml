name: Build macOS Application (.app)

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Compilar Caelum para macOS (Apple Silicon / Intel)
    runs-on: macos-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Caelum.app con PyInstaller
        run: |
          pyinstaller --noconfirm --windowed \
            --name "Caelum" \
            --icon "assets/icons/app_icon.icns" \
            --add-data "assets:assets" \
            --add-data "config.py:." \
            main.py

      - name: Empaquetar Caelum.app en ZIP para distribución
        run: |
          cd dist
          zip -r Caelum-macOS.zip Caelum.app

      - name: Subir artefacto macOS
        uses: actions/upload-artifact@v7
        with:
          name: Caelum-${{ github.ref_name }}-macOS-Universal
          path: dist/Caelum-macOS.zip
          if-no-files-found: error
